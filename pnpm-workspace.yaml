allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: false
  msw: true
  protobufjs: true
  unrs-resolver: true
overrides:
  protobufjs: 8.6.6
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

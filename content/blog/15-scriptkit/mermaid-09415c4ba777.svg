<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 520" role="img" aria-labelledby="scriptkit-mobile-title scriptkit-mobile-desc" font-family="CommitMono, monospace">
  <title id="scriptkit-mobile-title">Manual production release check</title>
  <desc id="scriptkit-mobile-desc">Flowchart showing a production update, cache invalidation, repeated version checks, waiting when unchanged, and notifying QA when the version updates.</desc>
  <defs>
    <marker id="scriptkit-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#a6a6a6" /></marker>
    <marker id="scriptkit-mobile-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#eb36a1" /></marker>
  </defs>
  <rect width="352" height="520" fill="#262626" />
  <text x="24" y="28" fill="#a6a6a6" font-size="16" letter-spacing="1.2">RELEASE CHECK · MOBILE</text>
  <g fill="none" stroke="#a6a6a6" stroke-width="2" marker-end="url(#scriptkit-mobile-arrow)">
    <line x1="180" y1="100" x2="180" y2="132" />
    <line x1="180" y1="196" x2="180" y2="220" />
    <path d="M 120 300 V 340 Q 120 348 112 348 H 96 Q 88 348 88 356 V 396" />
    <path d="M 240 300 V 340 Q 240 348 248 348 H 264 Q 272 348 272 356 V 396" />
    <path d="M 24 428 H 12 Q 4 428 4 420 V 264 Q 4 256 12 256 H 56" />
  </g>
  <g font-size="16">
    <rect x="128" y="312" width="32" height="20" rx="4" fill="#262626" /><text x="144" y="328" fill="#a6a6a6" text-anchor="middle">NO</text>
    <rect x="208" y="312" width="40" height="20" rx="4" fill="#262626" /><text x="228" y="328" fill="#eb36a1" text-anchor="middle">YES</text>
  </g>
  <g text-anchor="middle">
    <g><rect x="72" y="44" width="216" height="56" rx="20" fill="#303030" stroke="#777777" /><text x="180" y="80" fill="#f5f5f5" font-size="16">Update production</text></g>
    <g><rect x="72" y="132" width="216" height="64" rx="8" fill="#303030" stroke="#777777" /><text x="180" y="160" fill="#f5f5f5" font-size="16">Invalidate cache</text><text x="180" y="180" fill="#a6a6a6" font-size="16">wait for the edge</text></g>
    <g><polygon points="180,220 304,276 180,332 56,276" fill="#3b2937" stroke="#eb36a1" stroke-width="2" /><text x="180" y="272" fill="#f5f5f5" font-size="16">Production version</text><text x="180" y="292" fill="#f5f5f5" font-size="16">updated?</text></g>
    <g><rect x="24" y="396" width="144" height="64" rx="8" fill="#303030" stroke="#777777" /><text x="96" y="424" fill="#f5f5f5" font-size="16">Wait longer</text><text x="96" y="444" fill="#a6a6a6" font-size="16">check again</text></g>
    <g><rect x="192" y="396" width="144" height="72" rx="20" fill="#303030" stroke="#777777" /><text x="264" y="420" fill="#f5f5f5" font-size="16">Notify QA</text><text x="264" y="440" fill="#a6a6a6" font-size="16">testing can</text><text x="264" y="460" fill="#a6a6a6" font-size="16">begin</text></g>
  </g>
</svg>

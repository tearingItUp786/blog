<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="scriptkit-mobile-title scriptkit-mobile-desc">
<title id="scriptkit-mobile-title">Manual production release check</title>
<desc id="scriptkit-mobile-desc">Vertical flowchart showing a production update, cache invalidation, repeated version checks, waiting when unchanged, and notifying QA when the version updates.</desc>
<defs><marker id="scriptkit-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6" /></marker><marker id="scriptkit-mobile-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb36a1" /></marker></defs>
<rect width="600" height="960" fill="#262626" />
<text x="40" y="48" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8" letter-spacing="1.2">RELEASE CHECK · MOBILE</text>
<g fill="none" stroke="#a6a6a6" stroke-width="2" marker-end="url(#scriptkit-mobile-arrow)"><path d="M 300 156 V 208" /><path d="M 300 288 V 348" /><path d="M 300 524 V 616" /><path d="M 216 656 H 124 Q 96 656 96 628 V 436 H 212" /></g>
<path d="M 388 436 H 464 Q 496 436 496 468 V 584" fill="none" stroke="#eb36a1" stroke-width="2" marker-end="url(#scriptkit-mobile-accent)" />
<g font-family="CommitMono, monospace" text-anchor="middle"><g><rect x="212" y="88" width="176" height="68" rx="20" fill="#303030" stroke="#777777" /><text x="300" y="124" fill="#f5f5f5" font-size="12">Update prod</text></g><g><rect x="212" y="208" width="176" height="80" rx="6" fill="#303030" stroke="#777777" /><text x="300" y="244" fill="#f5f5f5" font-size="12">Invalidate cache</text><text x="300" y="268" fill="#a6a6a6" font-size="8">wait for edge</text></g><g><polygon points="300,348 388,436 300,524 212,436" fill="#3b2937" stroke="#eb36a1" stroke-width="2" /><text x="300" y="428" fill="#f5f5f5" font-size="12">Version</text><text x="300" y="448" fill="#f5f5f5" font-size="12">updated?</text></g><g><rect x="216" y="616" width="168" height="80" rx="6" fill="#303030" stroke="#777777" /><text x="300" y="652" fill="#f5f5f5" font-size="12">Wait longer</text><text x="300" y="676" fill="#a6a6a6" font-size="8">check again</text></g><g><rect x="408" y="584" width="176" height="80" rx="6" fill="#303030" stroke="#777777" /><text x="496" y="620" fill="#f5f5f5" font-size="12">Notify QA</text><text x="496" y="644" fill="#a6a6a6" font-size="8">testing begins</text></g><circle cx="496" cy="748" r="24" fill="#eb36a1" /><circle cx="496" cy="748" r="12" fill="#262626" /></g>
<path d="M 496 664 V 724" fill="none" stroke="#eb36a1" stroke-width="2" marker-end="url(#scriptkit-mobile-accent)" /><text x="420" y="420" fill="#eb36a1" font-family="CommitMono, monospace" font-size="8">YES</text><text x="316" y="568" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8">NO</text>
<line x1="40" y1="840" x2="560" y2="840" stroke="#4d4d4d" /><text x="40" y="876" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8">REPEAT UNTIL THE CACHE CATCHES UP</text>
</svg>

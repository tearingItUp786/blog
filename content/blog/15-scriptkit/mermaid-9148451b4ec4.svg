<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="scriptkit-wide-title scriptkit-wide-desc">
<title id="scriptkit-wide-title">Manual production release check</title>
<desc id="scriptkit-wide-desc">Flowchart showing a production update, cache invalidation, repeated version checks, waiting when unchanged, and notifying QA when the version updates.</desc>
<defs><marker id="scriptkit-wide-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6" /></marker><marker id="scriptkit-wide-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb36a1" /></marker></defs>
<rect width="960" height="600" fill="#262626" />
<text x="48" y="56" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8" letter-spacing="1.2">RELEASE CHECK · DESKTOP</text>
<g fill="none" stroke="#a6a6a6" stroke-width="2" marker-end="url(#scriptkit-wide-arrow)"><path d="M 188 256 H 260" /><path d="M 404 256 H 468" /><path d="M 624 256 H 696" /><path d="M 546 334 V 402 H 450" /><path d="M 338 438 H 280 Q 248 438 248 406 V 334 H 468" /></g>
<path d="M 840 256 H 880" fill="none" stroke="#eb36a1" stroke-width="2" marker-end="url(#scriptkit-wide-accent)" />
<g font-family="CommitMono, monospace" text-anchor="middle"><g><rect x="44" y="220" width="144" height="72" rx="20" fill="#303030" stroke="#777777" /><text x="116" y="252" fill="#f5f5f5" font-size="12">Update prod</text><text x="116" y="272" fill="#a6a6a6" font-size="8">release starts</text></g><g><rect x="260" y="220" width="144" height="72" rx="6" fill="#303030" stroke="#777777" /><text x="332" y="252" fill="#f5f5f5" font-size="12">Invalidate cache</text><text x="332" y="272" fill="#a6a6a6" font-size="8">wait for edge</text></g><g><polygon points="548,180 624,256 548,332 472,256" fill="#3b2937" stroke="#eb36a1" stroke-width="2" /><text x="548" y="248" fill="#f5f5f5" font-size="12">Version</text><text x="548" y="268" fill="#f5f5f5" font-size="12">updated?</text></g><g><rect x="696" y="220" width="144" height="72" rx="6" fill="#303030" stroke="#777777" /><text x="768" y="252" fill="#f5f5f5" font-size="12">Notify QA</text><text x="768" y="272" fill="#a6a6a6" font-size="8">testing can begin</text></g><g><rect x="304" y="404" width="144" height="72" rx="6" fill="#303030" stroke="#777777" /><text x="376" y="436" fill="#f5f5f5" font-size="12">Wait longer</text><text x="376" y="456" fill="#a6a6a6" font-size="8">check again</text></g><circle cx="900" cy="256" r="20" fill="#eb36a1" /><circle cx="900" cy="256" r="8" fill="#262626" /></g>
<text x="656" y="240" fill="#eb36a1" font-family="CommitMono, monospace" font-size="8">YES</text><text x="560" y="376" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8">NO</text>
<line x1="48" y1="528" x2="912" y2="528" stroke="#4d4d4d" /><text x="48" y="556" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8">THE LOOP HOLDS ATTENTION UNTIL THE CACHE CATCHES UP</text>
</svg>

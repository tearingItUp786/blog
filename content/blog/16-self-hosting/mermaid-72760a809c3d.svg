<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="cloudflare-sequence-title cloudflare-sequence-desc">
<title id="cloudflare-sequence-title">HTTP request through a Cloudflare Tunnel</title>
<desc id="cloudflare-sequence-desc">Sequence diagram showing a user request traveling to Cloudflare, through the Cloudflare Tunnel, and into the Coolify-hosted application.</desc>
<defs><marker id="cloudflare-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6" /></marker><marker id="cloudflare-sequence-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb36a1" /></marker></defs>
<rect width="960" height="600" fill="#262626" />
<text x="48" y="48" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8" letter-spacing="1.2">HTTP REQUEST · YOLO.TARANVEERBAINS.CA</text>
<g stroke="#595959" stroke-width="1" stroke-dasharray="4 4"><line x1="128" y1="148" x2="128" y2="492" /><line x1="360" y1="148" x2="360" y2="492" /><line x1="600" y1="148" x2="600" y2="492" /><line x1="832" y1="148" x2="832" y2="492" /></g>
<g fill="#353535" stroke="#777777"><rect x="64" y="80" width="128" height="68" rx="6" /><rect x="288" y="80" width="144" height="68" rx="6" /><rect x="520" y="80" width="160" height="68" rx="6" /><rect x="760" y="80" width="144" height="68" rx="6" /></g>
<rect x="596" y="260" width="8" height="144" fill="#3b2937" stroke="#eb36a1" />
<rect x="828" y="356" width="8" height="80" fill="#383838" stroke="#a6a6a6" />
<g font-family="CommitMono, monospace" text-anchor="middle"><text x="128" y="108" fill="#f5f5f5" font-size="12">User</text><text x="128" y="128" fill="#a6a6a6" font-size="8">browser</text><text x="360" y="108" fill="#f5f5f5" font-size="12">Cloudflare</text><text x="360" y="128" fill="#a6a6a6" font-size="8">edge</text><text x="600" y="108" fill="#f5f5f5" font-size="12">Cloudflare Tunnel</text><text x="600" y="128" fill="#eb36a1" font-size="8">private connector</text><text x="832" y="108" fill="#f5f5f5" font-size="12">My Coolify</text><text x="832" y="128" fill="#a6a6a6" font-size="8">origin</text></g>
<g fill="none" stroke="#a6a6a6" stroke-width="2" marker-end="url(#cloudflare-sequence-arrow)"><line x1="128" y1="220" x2="360" y2="220" /><line x1="360" y1="308" x2="596" y2="308" /></g><line x1="604" y1="388" x2="828" y2="388" stroke="#eb36a1" stroke-width="2" marker-end="url(#cloudflare-sequence-accent)" />
<g font-family="CommitMono, monospace" font-size="8" text-anchor="middle"><rect x="172" y="184" width="144" height="20" rx="4" fill="#262626" /><text x="244" y="196" fill="#a6a6a6">HTTP REQUEST</text><rect x="404" y="272" width="148" height="20" rx="4" fill="#262626" /><text x="476" y="284" fill="#a6a6a6">FORWARD REQUEST</text><rect x="640" y="352" width="152" height="20" rx="4" fill="#262626" /><text x="716" y="364" fill="#eb36a1">FORWARD TO ORIGIN</text></g>
<line x1="48" y1="524" x2="912" y2="524" stroke="#4d4d4d" /><text x="48" y="552" fill="#a6a6a6" font-family="CommitMono, monospace" font-size="8">THE ORIGIN STAYS PRIVATE; THE TUNNEL CARRIES THE REQUEST IN</text>
</svg>

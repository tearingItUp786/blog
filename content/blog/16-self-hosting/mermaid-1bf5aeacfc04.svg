<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 520" role="img" aria-labelledby="cloudflare-mobile-title cloudflare-mobile-desc" font-family="CommitMono, monospace">
  <title id="cloudflare-mobile-title">HTTP request through a Cloudflare Tunnel</title>
  <desc id="cloudflare-mobile-desc">Architecture showing a browser request passing through the Cloudflare edge and an outbound Cloudflare Tunnel connection before reaching the private Coolify application.</desc>
  <defs>
    <marker id="cloudflare-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#a6a6a6" /></marker>
    <marker id="cloudflare-mobile-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#eb36a1" /></marker>
  </defs>
  <rect width="352" height="520" fill="#262626" />
  <text x="24" y="28" fill="#a6a6a6" font-size="16" letter-spacing="1.2">HTTP REQUEST · MOBILE</text>
  <g fill="none" stroke="#a6a6a6" stroke-width="2" marker-end="url(#cloudflare-mobile-arrow)">
    <line x1="180" y1="108" x2="180" y2="156" />
    <line x1="180" y1="228" x2="180" y2="276" />
  </g>
  <line x1="180" y1="348" x2="180" y2="396" stroke="#eb36a1" stroke-width="2" marker-end="url(#cloudflare-mobile-arrow-accent)" />
  <g font-size="16">
    <rect x="200" y="116" width="120" height="24" rx="4" fill="#262626" /><text x="208" y="132" fill="#a6a6a6">HTTP REQUEST</text>
    <rect x="200" y="236" width="132" height="24" rx="4" fill="#262626" /><text x="208" y="252" fill="#a6a6a6">FORWARD REQUEST</text>
    <rect x="200" y="356" width="120" height="24" rx="4" fill="#262626" /><text x="208" y="372" fill="#eb36a1">PRIVATE LINK</text>
  </g>
  <g text-anchor="middle">
    <g><rect x="48" y="44" width="264" height="64" rx="8" fill="#303030" stroke="#777777" /><text x="180" y="72" fill="#f5f5f5" font-size="16">User browser</text><text x="180" y="92" fill="#a6a6a6" font-size="16">public request</text></g>
    <g><rect x="48" y="156" width="264" height="72" rx="8" fill="#303030" stroke="#777777" /><text x="180" y="188" fill="#f5f5f5" font-size="16">Cloudflare edge</text><text x="180" y="208" fill="#a6a6a6" font-size="16">public network</text></g>
    <g><rect x="48" y="276" width="264" height="72" rx="8" fill="#3b2937" stroke="#eb36a1" stroke-width="2" /><text x="180" y="308" fill="#f5f5f5" font-size="16">Cloudflare Tunnel</text><text x="180" y="328" fill="#f5f5f5" font-size="16">outbound connector</text></g>
    <g><rect x="48" y="396" width="264" height="72" rx="8" fill="#303030" stroke="#777777" /><text x="180" y="428" fill="#f5f5f5" font-size="16">Coolify app</text><text x="180" y="448" fill="#a6a6a6" font-size="16">private origin</text></g>
  </g>
</svg>
